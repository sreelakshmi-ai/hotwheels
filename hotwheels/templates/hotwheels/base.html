<!DOCTYPE html>
<html>
<head>
    <title>HotWheels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">HotWheels</a>
            <div>
                <a href="/products/" class="btn btn-outline-light">Products</a>
                <a href="/admin/" class="btn btn-outline-light">Admin</a>
                <a href="{% url 'cart' %}" class="btn btn-outline-warning ms-2">
                    🛒 Cart <span class="badge bg-danger">{{ cart_count }}</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
